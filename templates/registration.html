
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <!-- External CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style1.css') }}">

    <!-- External JavaScript -->
    <script src="{{ url_for('static', filename='js/scripts.js') }}"
            defer></script>
</head>
<body>

    <div class="container">

        <!-- Header Image -->
        <div class="header">
            <img src="{{ url_for('static', filename='images/header.jpg') }}"
                 alt="Registration Header">
            <div class="header-text">
                <h1>Create Your Account</h1>
                <p>Register to get started!</p>
            </div>
        </div>

        <!-- Registration Form -->
        <form id="registrationForm" novalidate>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname"
                   placeholder="Enter your full name">
            <small id="nameError" class="error"></small>

            <label for="email">Email Address</label>
            <input type="text" id="email"
                   placeholder="Enter your email">
            <small id="emailError" class="error"></small>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Create a password">
            <small id="passwordError" class="error"></small>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Re-enter your password">
            <small id="confirmError" class="error"></small>

            <button type="submit">Register</button>

            <p id="successMessage" class="success"></p>

        </form>

    </div>

</body>
</html>
